name: COVA Task Manager CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  GCP_REGION: us-central1
  BACKEND_SERVICE_NAME: cova-task-manager-backend
  FRONTEND_SERVICE_NAME: cova-task-manager-frontend

jobs:
  # =========================================================
  # JOB 1 : BACKEND CI/CD (Maven Tests, Build & Docker Image)
  # =========================================================
  backend-pipeline:
    name: Backend CI/CD (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Unit Tests & Build Package
        working-directory: ./backend
        run: mvn clean package -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t cova-task-manager-backend:latest ./backend

      - name: Authenticate to Google Cloud (Optional GCP Deploy)
        if: github.ref == 'refs/heads/main' && secrets.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy Backend to GCP Cloud Run
        if: github.ref == 'refs/heads/main' && secrets.GCP_SA_KEY != ''
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.BACKEND_SERVICE_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated'

  # =========================================================
  # JOB 2 : FRONTEND CI/CD (React Build & Nginx Docker Image)
  # =========================================================
  frontend-pipeline:
    name: Frontend CI/CD (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies & Build Bundle
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Nginx Docker Image
        run: |
          docker build -t cova-task-manager-frontend:latest ./frontend

      - name: Authenticate to Google Cloud (Optional GCP Deploy)
        if: github.ref == 'refs/heads/main' && secrets.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy Frontend to GCP Cloud Run
        if: github.ref == 'refs/heads/main' && secrets.GCP_SA_KEY != ''
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.FRONTEND_SERVICE_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated'
