name: COVA Task Manager CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # =========================================================
  # JOB 1 : BACKEND CI (Maven Unit Tests, Build & Docker Image)
  # =========================================================
  backend-ci:
    name: Backend CI (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Unit Tests & Build Package
        working-directory: ./backend
        run: mvn clean package -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t cova-task-manager-backend:latest ./backend

  # =========================================================
  # JOB 2 : FRONTEND CI (React Build & Nginx Docker Image)
  # =========================================================
  frontend-ci:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies & Build Bundle
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Nginx Docker Image
        run: |
          docker build -t cova-task-manager-frontend:latest ./frontend

  # =========================================================
  # JOB 3 : GCP CLOUD RUN DEPLOYMENT (Bonus Cloud Deploy)
  # =========================================================
  gcp-deploy:
    name: GCP Cloud Run Deployment
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && secrets.GCP_SA_KEY != ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Artifact Registry
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and Push Backend Docker Image
        run: |
          IMAGE_TAG="gcr.io/${{ secrets.GCP_PROJECT_ID }}/cova-task-manager-backend:${{ github.sha }}"
          docker build -t $IMAGE_TAG ./backend
          docker push $IMAGE_TAG

      - name: Deploy Backend to GCP Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: cova-task-manager-backend
          region: us-central1
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/cova-task-manager-backend:${{ github.sha }}
          flags: '--allow-unauthenticated'

      - name: Build and Push Frontend Docker Image
        run: |
          IMAGE_TAG="gcr.io/${{ secrets.GCP_PROJECT_ID }}/cova-task-manager-frontend:${{ github.sha }}"
          docker build -t $IMAGE_TAG ./frontend
          docker push $IMAGE_TAG

      - name: Deploy Frontend to GCP Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: cova-task-manager-frontend
          region: us-central1
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/cova-task-manager-frontend:${{ github.sha }}
          flags: '--allow-unauthenticated'
